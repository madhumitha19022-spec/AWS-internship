services:
  - type: web
    name: aws-internship-portal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AWS_REGION
        value: ap-south-1
      - key: S3_BUCKET_NAME
        value: aws-internship-portal-madhumitha
      - key: FLASK_DEBUG
        value: "False"
