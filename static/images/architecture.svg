<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#172A45" />
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="subnetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="ec2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <text x="500" y="45" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AWS CLOUD ARCHITECTURE TOPOLOGY</text>
  <text x="500" y="68" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle">Student Internship Portal: Custom VPC, EC2, S3, IAM, CloudWatch, SNS, EBS &amp; Budgets</text>

  <!-- External User Layer -->
  <g transform="translate(60, 110)">
    <rect width="160" height="75" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="35" cy="37" r="18" fill="#0D6EFD" />
    <!-- User Icon -->
    <path d="M35 30 A5 5 0 1 0 35 40 A5 5 0 1 0 35 30 Z M27 47 C27 42.5 30.5 41 35 41 C39.5 41 43 42.5 43 47 Z" fill="#FFFFFF" />
    <text x="65" y="34" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Client Users</text>
    <text x="65" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Browser / HTTP</text>
  </g>

  <!-- Arrow: User to IGW -->
  <path d="M220 147 L280 147" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="280,142 290,147 280,152" fill="#38BDF8" />
  <text x="255" y="138" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">Port 80</text>

  <!-- Custom VPC Boundary -->
  <rect x="290" y="90" width="670" height="560" rx="16" fill="url(#vpcGrad)" stroke="#0D6EFD" stroke-width="2" stroke-dasharray="8,6" />
  <rect x="305" y="102" width="220" height="24" rx="6" fill="#0D6EFD" />
  <text x="415" y="118" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CUSTOM VPC (10.0.0.0/16)</text>

  <!-- Internet Gateway (IGW) -->
  <g transform="translate(320, 140)">
    <rect width="130" height="50" rx="8" fill="#1E293B" stroke="#00D2D3" stroke-width="1.5" />
    <text x="65" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00D2D3" text-anchor="middle">Internet Gateway</text>
    <text x="65" y="40" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94A3B8" text-anchor="middle">IGW: 0.0.0.0/0</text>
  </g>

  <!-- Arrow: IGW to Public Subnet -->
  <path d="M450 165 L500 165" stroke="#00D2D3" stroke-width="2" />
  <polygon points="500,161 508,165 500,169" fill="#00D2D3" />

  <!-- Public Subnet Boundary -->
  <rect x="490" y="130" width="450" height="250" rx="12" fill="url(#subnetGrad)" stroke="#38BDF8" stroke-width="1.5" />
  <rect x="505" y="140" width="200" height="20" rx="5" fill="#0284C7" />
  <text x="605" y="154" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PUBLIC SUBNET (10.0.1.0/24)</text>

  <!-- EC2 Instance Box -->
  <g transform="translate(520, 175)">
    <rect width="390" height="185" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)" />
    
    <!-- EC2 Badge -->
    <rect x="15" y="12" width="130" height="22" rx="4" fill="url(#ec2Grad)" />
    <text x="80" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0A192F" text-anchor="middle">AWS EC2 (t2/t3.micro)</text>

    <!-- Public IP & OS -->
    <text x="375" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="end">Public IP | Ubuntu 24.04</text>

    <!-- Sub-components inside EC2 -->
    <!-- Flask Web App -->
    <rect x="15" y="45" width="170" height="50" rx="6" fill="#0A192F" stroke="#38BDF8" stroke-width="1" />
    <text x="100" y="65" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Flask Application</text>
    <text x="100" y="82" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8" text-anchor="middle">Gunicorn + Port 5000</text>

    <!-- Nginx Reverse Proxy -->
    <rect x="200" y="45" width="175" height="50" rx="6" fill="#0A192F" stroke="#10B981" stroke-width="1" />
    <text x="287" y="65" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Nginx Reverse Proxy</text>
    <text x="287" y="82" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#10B981" text-anchor="middle">Port 80 &rarr; 5000</text>

    <!-- Log Analyzer Engine -->
    <rect x="15" y="105" width="170" height="65" rx="6" fill="#0A192F" stroke="#A855F7" stroke-width="1" />
    <text x="100" y="126" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#A855F7" text-anchor="middle">Log Analyzer Engine</text>
    <text x="100" y="142" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#E2E8F0" text-anchor="middle">analyze_logs.py</text>
    <text x="100" y="156" font-family="'Inter', sans-serif" font-size="8" font-weight="400" fill="#94A3B8" text-anchor="middle">750+ Access Logs Analyzed</text>

    <!-- Security Group Details -->
    <rect x="200" y="105" width="175" height="65" rx="6" fill="#0A192F" stroke="#E2E8F0" stroke-width="1" />
    <text x="287" y="126" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Security Group</text>
    <text x="287" y="142" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#10B981" text-anchor="middle">&bull; Port 80 (HTTP World)</text>
    <text x="287" y="156" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#F59E0B" text-anchor="middle">&bull; Port 22 (SSH Admin)</text>
  </g>

  <!-- IAM Instance Profile -->
  <g transform="translate(320, 220)">
    <rect width="140" height="75" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
    <text x="70" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#EC4899" text-anchor="middle">IAM Instance Role</text>
    <text x="70" y="42" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#F472B6" text-anchor="middle">Least-Privilege</text>
    <text x="70" y="58" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#94A3B8" text-anchor="middle">Zero Access Keys</text>
  </g>
  <path d="M460 257 L520 257" stroke="#EC4899" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Integrated AWS Services Layer (Bottom) -->
  
  <!-- Amazon S3 -->
  <g transform="translate(320, 420)">
    <rect width="180" height="100" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="15" y="12" width="75" height="20" rx="4" fill="#10B981" />
    <text x="52" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Amazon S3</text>
    <text x="15" y="52" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF">Private Object Bucket</text>
    <text x="15" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">&bull; Logs &amp; Dataset Storage</text>
    <text x="15" y="82" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">&bull; Block Public Access = ON</text>
  </g>
  <path d="M570 360 L570 470 L500 470" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="500,466 492,470 500,474" fill="#10B981" />

  <!-- CloudWatch & SNS -->
  <g transform="translate(530, 420)">
    <rect width="220" height="100" rx="10" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="15" y="12" width="125" height="20" rx="4" fill="#F43F5E" />
    <text x="77" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">CloudWatch &amp; SNS</text>
    <text x="15" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Alarms &amp; Notifications</text>
    <text x="15" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">&bull; CPU &gt; 70% Alert</text>
    <text x="15" y="82" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">&bull; StatusCheckFailed Alert</text>
  </g>
  <path d="M640 360 L640 420" stroke="#F43F5E" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="636,420 640,428 644,420" fill="#F43F5E" />

  <!-- SNS Email Receiver (External) -->
  <g transform="translate(570, 545)">
    <rect width="180" height="45" rx="6" fill="#1E293B" stroke="#00D2D3" stroke-width="1" />
    <text x="90" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00D2D3" text-anchor="middle">SNS Email Alerts</text>
    <text x="90" y="35" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#CBD5E1" text-anchor="middle">madhumitha19022@gmail.com</text>
  </g>
  <path d="M640 520 L640 545" stroke="#00D2D3" stroke-width="2" />

  <!-- EBS Snapshot Backup -->
  <g transform="translate(770, 420)">
    <rect width="170" height="100" rx="10" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="15" y="12" width="115" height="20" rx="4" fill="#8B5CF6" />
    <text x="72" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">EBS Snapshot</text>
    <text x="15" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Point-In-Time Backup</text>
    <text x="15" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">&bull; Root Volume Backup</text>
    <text x="15" y="82" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">&bull; Disaster Recovery</text>
  </g>
  <path d="M780 360 L780 400 L855 400 L855 420" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="851,420 855,428 859,420" fill="#8B5CF6" />

  <!-- AWS Budgets (Cost Safeguard) -->
  <g transform="translate(60, 530)">
    <rect width="210" height="85" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="15" y="12" width="110" height="20" rx="4" fill="#10B981" />
    <text x="70" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">AWS Budgets</text>
    <text x="15" y="48" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Zero-Cost Safeguard</text>
    <text x="15" y="64" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#94A3B8">&bull; Monthly Limit: $1.00 USD</text>
    <text x="15" y="77" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#94A3B8">&bull; 0 NAT / 0 ALB / 0 RDS</text>
  </g>

</svg>
